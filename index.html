<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador 3D Prático de Geometria Molecular (VSEPR)</title>
    <style>
        :root {
            --bg-primary: #0d0e12;
            --bg-surface: #16171d;
            --bg-control: #21232c;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #6366f1;
            --border: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-surface);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            height: calc(100vh - 70px);
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            .canvas-container {
                height: 50vh !important;
            }
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #1a1c23 0%, #08080a 100%);
            height: 100%;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sidebar {
            width: 360px;
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group {
            background-color: var(--bg-control);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.4);
        }

        .info-panel {
            background-color: rgba(99, 102, 241, 0.08);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
        }

        .info-row {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .info-row strong {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-val {
            color: #f3f4f6;
            font-weight: bold;
            display: inline-block;
            margin-left: 0.25rem;
        }

        .accessibility-toast {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <h1>Simulador 3D Prático de Geometria Molecular (VSEPR)</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Visualização moderna com cores elementares e efeito Neon</p>
    </header>

    <main class="main-container">
        <div class="canvas-container" role="img" id="canvas-container" aria-label="Visualização 3D da molécula selecionada.">
            <canvas id="canvas3d"></canvas>
            <div id="toast" class="accessibility-toast" aria-live="polite"></div>
        </div>

        <section class="sidebar" aria-label="Painel de Controle e Informações">
            <div class="control-group">
                <h2 class="section-title">1. Escolha a Configuração</h2>
                <label id="molecule-select-label" for="molecule-select">Selecione o arranjo VSEPR:</label>
                <select id="molecule-select" aria-labelledby="molecule-select-label"></select>
            </div>

            <div class="info-panel" id="info-panel" aria-live="assertive">
                <h2 class="section-title">2. Dados Detalhados</h2>
                <div class="info-row"><strong>Geometria:</strong><span class="info-val" id="val-geometria">-</span></div>
                <div class="info-row"><strong>Ângulo Ideal:</strong><span class="info-val" id="val-angulo">-</span></div>
                <div class="info-row"><strong>Pares Ligantes:</strong><span class="info-val" id="val-ligantes">-</span></div>
                <div class="info-row"><strong>Pares Livres:</strong><span class="info-val" id="val-livres">-</span></div>
                <div class="info-row"><strong>Arranjo das Nuvens:</strong><span class="info-val" id="val-arranjo">-</span></div>
                <div class="info-row" style="margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.5rem;">
                    <strong>Exemplo Real:</strong><span class="info-val" id="val-exemplo">-</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Cores específicas por elemento (padrão CPK/IUPAC estilizado)[cite: 1]
        const vseprData = [
            { steric: 2, lig: 2, lone: 0, name: "Linear", angle: "180°", arr: "Linear", ex: "CO₂ (Dióxido de Carbono)", centralColor: 0x333333, ligandColor: 0xef4444 },
            { steric: 3, lig: 3, lone: 0, name: "Trigonal Plana", angle: "120°", arr: "Trigonal Plana", ex: "BF₃ (Trifluoreto de Boro)", centralColor: 0xff88a5, ligandColor: 0x22c55e },
            { steric: 3, lig: 2, lone: 1, name: "Angular", angle: "< 120°", arr: "Trigonal Plana", ex: "SO₂ (Dióxido de Enxofre)", centralColor: 0xeab308, ligandColor: 0xef4444 },
            { steric: 4, lig: 4, lone: 0, name: "Tetraédrica", angle: "109.5°", arr: "Tetraédrica", ex: "CH₄ (Metano)", centralColor: 0x333333, ligandColor: 0xf8fafc },
            { steric: 4, lig: 3, lone: 1, name: "Piramidal Trigonal", angle: "107°", arr: "Tetraédrica", ex: "NH₃ (Amônia)", centralColor: 0x3b82f6, ligandColor: 0xf8fafc },
            { steric: 4, lig: 2, lone: 2, name: "Angular", angle: "104.5°", arr: "Tetraédrica", ex: "H₂O (Água)", centralColor: 0xef4444, ligandColor: 0xf8fafc },
            { steric: 5, lig: 5, lone: 0, name: "Bipirâmide Trigonal", angle: "90°, 120°", arr: "Bipirâmide Trigonal", ex: "PCl₅ (Pentacloreto de Fósforo)", centralColor: 0xf97316, ligandColor: 0x10b981 },
            { steric: 5, lig: 4, lone: 1, name: "Gangorra", angle: "90°, 120°", arr: "Bipirâmide Trigonal", ex: "SF₄ (Tetrafluoreto de Enxofre)", centralColor: 0xeab308, ligandColor: 0x22c55e },
            { steric: 5, lig: 3, lone: 2, name: "Forma de T", angle: "90°", arr: "Bipirâmide Trigonal", ex: "ClF₃ (Trifluoreto de Cloro)", centralColor: 0x10b981, ligandColor: 0x22c55e },
            { steric: 5, lig: 2, lone: 3, name: "Linear", angle: "180°", arr: "Bipirâmide Trigonal", ex: "XeF₂ (Difluoreto de Xenônio)", centralColor: 0xa855f7, ligandColor: 0x22c55e },
            { steric: 6, lig: 6, lone: 0, name: "Octaédrica", angle: "90°", arr: "Octaédrica", ex: "SF₆ (Hexafluoreto de Enxofre)", centralColor: 0xeab308, ligandColor: 0x22c55e },
            { steric: 6, lig: 5, lone: 1, name: "Pirâmide Quadrada", angle: "90°", arr: "Octaédrica", ex: "BrF₅ (Pentafluoreto de Bromo)", centralColor: 0x991b1b, ligandColor: 0x22c55e },
            { steric: 6, lig: 4, lone: 2, name: "Quadrada Plana", angle: "90°", arr: "Octaédrica", ex: "XeF₄ (Tetrafluoreto de Xenônio)", centralColor: 0xa855f7, ligandColor: 0x22c55e },
            { steric: 2, lig: 1, lone: 1, name: "Linear (Diatômica)", angle: "180°", arr: "Linear", ex: "HF (Fluoreto de Hidrogênio)", centralColor: 0x22c55e, ligandColor: 0xf8fafc },
            { steric: 3, lig: 1, lone: 2, name: "Linear (Diatômica)", angle: "180°", arr: "Trigonal Plana", ex: "O₂ (Oxigênio)", centralColor: 0xef4444, ligandColor: 0xef4444 },
            { steric: 4, lig: 1, lone: 3, name: "Linear (Diatômica)", angle: "180°", arr: "Tetraédrica", ex: "HCl (Ácido Clorídrico)", centralColor: 0x10b981, ligandColor: 0xf8fafc },
            { steric: 5, lig: 1, lone: 4, name: "Linear (Diatômica)", angle: "180°", arr: "Bipirâmide Trigonal", ex: "Espécie teórica", centralColor: 0xec4899, ligandColor: 0x06b6d4 },
            { steric: 6, lig: 3, lone: 3, name: "Forma de T (Teórica)", angle: "< 90°", arr: "Octaédrica", ex: "Íon teórico", centralColor: 0xec4899, ligandColor: 0x06b6d4 },
            { steric: 6, lig: 2, lone: 4, name: "Linear", angle: "180°", arr: "Octaédrica", ex: "Íon complexo ICl₂⁻", centralColor: 0x6b21a8, ligandColor: 0x10b981 },
            { steric: 6, lig: 1, lone: 5, name: "Linear (Diatômica)", angle: "180°", arr: "Octaédrica", ex: "Espécie teórica", centralColor: 0xec4899, ligandColor: 0x06b6d4 }
        ];

        const selectEl = document.getElementById("molecule-select");
        const valGeometria = document.getElementById("val-geometria");
        const valAngulo = document.getElementById("val-angulo");
        const valLigantes = document.getElementById("val-ligantes");
        const valLivres = document.getElementById("val-livres");
        const valArranjo = document.getElementById("val-arranjo");
        const valExemplo = document.getElementById("val-exemplo");
        const canvasContainer = document.getElementById("canvas-container");
        const toastEl = document.getElementById("toast");

        vseprData.forEach((item, index) => {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = `Nuvens: ${item.steric} → Ligantes: ${item.lig} | Livres: ${item.lone} (${item.name})`;
            selectEl.appendChild(option);
        });

        const canvas = document.getElementById("canvas3d");
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x6366f1, 0.3);
        dirLight2.position.set(-5, -5, 3);
        scene.add(dirLight2);

        const moleculeGroup = new THREE.Group();
        scene.add(moleculeGroup);

        // Materiais do Efeito Neon para os Balões de Elétrons[cite: 1]
        const lonePairCoreMat = new THREE.MeshStandardMaterial({
            color: 0x00f3ff,
            emissive: 0x00c3ff,
            emissiveIntensity: 0.9,
            roughness: 0.1,
            transparent: true,
            opacity: 0.8
        });

        const lonePairGlowMat = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.35,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide
        });

        const bondMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.4 });

        // Geometrias Base
        const coreGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const ligGeo = new THREE.SphereGeometry(0.4, 32, 32);
        const loneCoreGeo = new THREE.SphereGeometry(0.35, 24, 24);
        const loneGlowGeo = new THREE.SphereGeometry(0.48, 24, 24);

        function getVSEPRVectors(stericCount) {
            const vectors = [];
            if (stericCount === 2) {
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(0, -1, 0));
            } else if (stericCount === 3) {
                for (let i = 0; i < 3; i++) {
                    let angle = (i * 2 * Math.PI) / 3;
                    vectors.push(new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0));
                }
            } else if (stericCount === 4) {
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(Math.sqrt(8/9), -1/3, 0));
                vectors.push(new THREE.Vector3(-Math.sqrt(2/9), -1/3, Math.sqrt(2/3)));
                vectors.push(new THREE.Vector3(-Math.sqrt(2/9), -1/3, -Math.sqrt(2/3)));
            } else if (stericCount === 5) {
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(0, -1, 0));
                for (let i = 0; i < 3; i++) {
                    let angle = (i * 2 * Math.PI) / 3;
                    vectors.push(new THREE.Vector3(Math.cos(angle) * 0.9, 0, Math.sin(angle) * 0.9));
                }
            } else if (stericCount === 6) {
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(0, -1, 0));
                vectors.push(new THREE.Vector3(1, 0, 0));
                vectors.push(new THREE.Vector3(-1, 0, 0));
                vectors.push(new THREE.Vector3(0, 0, 1));
                vectors.push(new THREE.Vector3(0, 0, -1));
            }
            return vectors;
        }

        function updateSimulation(index) {
            const data = vseprData[index];

            valGeometria.textContent = data.name;
            valAngulo.textContent = data.angle;
            valLigantes.textContent = data.lig;
            valLivres.textContent = data.lone;
            valArranjo.textContent = data.arr;
            valExemplo.textContent = data.ex;

            const screenReaderText = `Molécula alterada. Geometria ${data.name}, com ângulo de ${data.angle}.`;
            canvasContainer.setAttribute("aria-label", `Estrutura tridimensional de uma geometria ${data.name}. ` + screenReaderText);
            
            toastEl.textContent = `${data.name} (${data.angle})`;
            toastEl.style.opacity = 1;
            setTimeout(() => { toastEl.style.opacity = 0; }, 2000);

            while(moleculeGroup.children.length > 0){ 
                moleculeGroup.remove(moleculeGroup.children[0]); 
            }

            // Criar materiais dinâmicos com cores exclusivas por tipo de átomo[cite: 1]
            const centralMat = new THREE.MeshStandardMaterial({ 
                color: data.centralColor, 
                roughness: 0.2, 
                metalness: 0.1 
            });
            
            const ligandMat = new THREE.MeshStandardMaterial({ 
                color: data.ligandColor, 
                roughness: 0.3 
            });

            // Átomo Central
            const centralMesh = new THREE.Mesh(coreGeo, centralMat);
            moleculeGroup.add(centralMesh);

            const baseVectors = getVSEPRVectors(data.steric);

            if (data.steric === 5) {
                const axial = [baseVectors[0], baseVectors[1]];
                const equatorial = [baseVectors[2], baseVectors[3], baseVectors[4]];
                
                const currentLigands = [];
                const currentLones = [];
                let remainingLones = data.lone;
                
                for(let vec of equatorial) {
                    if(remainingLones > 0) {
                        currentLones.push(vec);
                        remainingLones--;
                    } else {
                        currentLigands.push(vec);
                    }
                }
                for(let vec of axial) {
                    if(remainingLones > 0) {
                        currentLones.push(vec);
                        remainingLones--;
                    } else {
                        currentLigands.push(vec);
                    }
                }

                currentLigands.forEach(vec => renderLigand(vec, 1.8, ligandMat));
                currentLones.forEach(vec => renderLonePair(vec, 1.4));

            } else {
                for (let i = 0; i < data.steric; i++) {
                    if (i < data.lig) {
                        renderLigand(baseVectors[i], 1.8, ligandMat);
                    } else {
                        renderLonePair(baseVectors[i], 1.4);
                    }
                }
            }
        }

        function renderLigand(vector, distance, material) {
            const targetPos = vector.clone().multiplyScalar(distance);
            
            const atomMesh = new THREE.Mesh(ligGeo, material);
            atomMesh.position.copy(targetPos);
            moleculeGroup.add(atomMesh);

            const bondGeo = new THREE.CylinderGeometry(0.08, 0.08, distance, 16);
            const bondMesh = new THREE.Mesh(bondGeo, bondMat);
            
            bondMesh.position.copy(targetPos).multiplyScalar(0.5);
            bondMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vector.clone().normalize());
            moleculeGroup.add(bondMesh);
        }

        // Renderização dos Balões de Elétrons com Efeito Glow/Neon + Ponto de Luz Cyan[cite: 1]
        function renderLonePair(vector, distance) {
            const targetPos = vector.clone().multiplyScalar(distance);

            // Núcleo brilhante
            const loneMesh = new THREE.Mesh(loneCoreGeo, lonePairCoreMat);
            loneMesh.position.copy(targetPos);
            moleculeGroup.add(loneMesh);

            // Halo translúcido (Brilho Neon exterior)[cite: 1]
            const glowMesh = new THREE.Mesh(loneGlowGeo, lonePairGlowMat);
            glowMesh.position.copy(targetPos);
            moleculeGroup.add(glowMesh);

            // Emissão de luz real no ambiente[cite: 1]
            const neonLight = new THREE.PointLight(0x00ffff, 1.2, 2.5);
            neonLight.position.copy(targetPos);
            moleculeGroup.add(neonLight);
        }

        selectEl.addEventListener("change", (e) => {
            updateSimulation(parseInt(e.target.value));
        });

        updateSimulation(0);

        function animate() {
            requestAnimationFrame(animate);
            moleculeGroup.rotation.y += 0.005;
            moleculeGroup.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            const width = canvasContainer.clientWidth;
            const height = canvasContainer.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        });

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', () => { isDragging = true; });
        canvas.addEventListener('touchstart', (e) => { isDragging = true; previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchend', () => { isDragging = false; });

        canvas.addEventListener('mousemove', (e) => {
            const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
            if (isDragging) {
                moleculeGroup.rotation.y += deltaMove.x * 0.01;
                moleculeGroup.rotation.x += deltaMove.y * 0.01;
            }
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            const deltaMove = { x: x - previousMousePosition.x, y: y - previousMousePosition.y };
            moleculeGroup.rotation.y += deltaMove.x * 0.01;
            moleculeGroup.rotation.x += deltaMove.y * 0.01;
            
            previousMousePosition = { x: x, y: y };
        });
    </script>
</body>
</html>

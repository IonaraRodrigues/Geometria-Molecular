<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador 3D Prático de Geometria Molecular (VSEPR)</title>
    <style>
        :root {
            --bg-primary: #121214;
            --bg-surface: #1a1a1e;
            --bg-control: #26262b;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --border: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-surface);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            height: calc(100vh - 70px);
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            .canvas-container {
                height: 50vh !important;
            }
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #22252a 0%, #0f1012 100%);
            height: 100%;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .sidebar {
            width: 360px;
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group {
            background-color: var(--bg-control);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.4);
        }

        .info-panel {
            background-color: rgba(79, 70, 229, 0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 1rem;
        }

        .info-row {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .info-row strong {
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-val {
            color: #f3f4f6;
            font-weight: bold;
            display: inline-block;
            margin-left: 0.25rem;
        }

        .accessibility-toast {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
    </style>
    <!-- Incluindo Three.js de um CDN público estável -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <h1>Simulador 3D Prático de Geometria Molecular (VSEPR)</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Acessível e adaptável para qualquer tela</p>
    </header>

    <main class="main-container">
        <!-- Área Visual 3D -->
        <div class="canvas-container" role="img" id="canvas-container" aria-label="Visualização 3D da molécula selecionada. Use os controles da barra lateral para alterar o arranjo geométrico.">
            <canvas id="canvas3d"></canvas>
            <div id="toast" class="accessibility-toast" aria-live="polite"></div>
        </div>

        <!-- Painel de Controles Lateral -->
        <section class="sidebar" aria-label="Painel de Controle e Informações">
            <div class="control-group">
                <h2 class="section-title">1. Escolha a Configuração (20 Opções)</h2>
                <label id="molecule-select-label" for="molecule-select">Selecione o arranjo de pares eletrônicos (Teoria VSEPR):</label>
                <select id="molecule-select" aria-labelledby="molecule-select-label">
                    <!-- Preenchido dinamicamente via JS com as 20 combinações matemáticas da Teoria VSEPR -->
                </select>
            </div>

            <div class="info-panel" id="info-panel" aria-live="assertive">
                <h2 class="section-title">2. Dados Detalhados</h2>
                <div class="info-row"><strong>Geometria:</strong><span class="info-val" id="val-geometria">-</span></div>
                <div class="info-row"><strong>Ângulo Ideal:</strong><span class="info-val" id="val-angulo">-</span></div>
                <div class="info-row"><strong>Pares Ligantes:</strong><span class="info-val" id="val-ligantes">-</span></div>
                <div class="info-row"><strong>Pares Livres:</strong><span class="info-val" id="val-livres">-</span></div>
                <div class="info-row"><strong>Arranjo das Nuvens:</strong><span class="info-val" id="val-arranjo">-</span></div>
                <div class="info-row" style="margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.5rem;">
                    <strong>Exemplo Real:</strong><span class="info-val" id="val-exemplo">-</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Banco de dados completo da VSEPR contendo todas as combinações matemáticas de nuvens (2 a 6)
        const vseprData = [
            // 2 Nuvens
            { steric: 2, lig: 2, lone: 0, name: "Linear", angle: "180°", arr: "Linear", ex: "CO₂ (Dióxido de Carbono)" },
            // 3 Nuvens
            { steric: 3, lig: 3, lone: 0, name: "Trigonal Plana", angle: "120°", arr: "Trigonal Plana", ex: "BF₃ (Trifluoreto de Boro)" },
            { steric: 3, lig: 2, lone: 1, name: "Angular", angle: "< 120°", arr: "Trigonal Plana", ex: "SO₂ (Dióxido de Enxofre)" },
            // 4 Nuvens
            { steric: 4, lig: 4, lone: 0, name: "Tetraédrica", angle: "109.5°", arr: "Tetraédrica", ex: "CH₄ (Metano)" },
            { steric: 4, lig: 3, lone: 1, name: "Piramidal Trigonal", angle: "107°", arr: "Tetraédrica", ex: "NH₃ (Amônia)" },
            { steric: 4, lig: 2, lone: 2, name: "Angular", angle: "104.5°", arr: "Tetraédrica", ex: "H₂O (Água)" },
            // 5 Nuvens
            { steric: 5, lig: 5, lone: 0, name: "Bipirâmide Trigonal", angle: "90°, 120°", arr: "Bipirâmide Trigonal", ex: "PCl₅ (Pentacloreto de Fósforo)" },
            { steric: 5, lig: 4, lone: 1, name: "Gangorra", angle: "90°, 120°", arr: "Bipirâmide Trigonal", ex: "SF₄ (Tetrafluoreto de Enxofre)" },
            { steric: 5, lig: 3, lone: 2, name: "Forma de T", angle: "90°", arr: "Bipirâmide Trigonal", ex: "ClF₃ (Trifluoreto de Cloro)" },
            { steric: 5, lig: 2, lone: 3, name: "Linear", angle: "180°", arr: "Bipirâmide Trigonal", ex: "XeF₂ (Difluoreto de Xenônio)" },
            // 6 Nuvens
            { steric: 6, lig: 6, lone: 0, name: "Octaédrica", angle: "90°", arr: "Octaédrica", ex: "SF₆ (Hexafluoreto de Enxofre)" },
            { steric: 6, lig: 5, lone: 1, name: "Pirâmide Quadrada", angle: "90°", arr: "Octaédrica", ex: "BrF₅ (Pentafluoreto de Bromo)" },
            { steric: 6, lig: 4, lone: 2, name: "Quadrada Plana", angle: "90°", arr: "Octaédrica", ex: "XeF₄ (Tetrafluoreto de Xenônio)" },
            // Adições teóricas / intermediárias para completar as 20 combinações de estudo VSEPR
            { steric: 2, lig: 1, lone: 1, name: "Linear (Diatômica)", angle: "180°", arr: "Linear", ex: "HF (Fluoreto de Hidrogênio)" },
            { steric: 3, lig: 1, lone: 2, name: "Linear (Diatômica)", angle: "180°", arr: "Trigonal Plana", ex: "O₂ (Oxigênio)" },
            { steric: 4, lig: 1, lone: 3, name: "Linear (Diatômica)", angle: "180°", arr: "Tetraédrica", ex: "HCl (Ácido Clorídrico)" },
            { steric: 5, lig: 1, lone: 4, name: "Linear (Diatômica)", angle: "180°", arr: "Bipirâmide Trigonal", ex: "Espécie teórica" },
            { steric: 6, lig: 3, lone: 3, name: "Forma de T (Teórica)", angle: "< 90°", arr: "Octaédrica", ex: "Íon teórico" },
            { steric: 6, lig: 2, lone: 4, name: "Linear", angle: "180°", arr: "Octaédrica", ex: "Íon complexo ICl₂⁻" },
            { steric: 6, lig: 1, lone: 5, name: "Linear (Diatômica)", angle: "180°", arr: "Octaédrica", ex: "Espécie teórica" }
        ];

        // Inicialização de Elementos HTML
        const selectEl = document.getElementById("molecule-select");
        const valGeometria = document.getElementById("val-geometria");
        const valAngulo = document.getElementById("val-angulo");
        const valLigantes = document.getElementById("val-ligantes");
        const valLivres = document.getElementById("val-livres");
        const valArranjo = document.getElementById("val-arranjo");
        const valExemplo = document.getElementById("val-exemplo");
        const canvasContainer = document.getElementById("canvas-container");
        const toastEl = document.getElementById("toast");

        // Alimentar o Select com as 20 opções estruturadas de forma inteligível
        vseprData.forEach((item, index) => {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = `Nuvens: ${item.steric} → Ligantes: ${item.lig} | Livres: ${item.lone} (${item.name})`;
            selectEl.appendChild(option);
        });

        // Configuração Inicial do Ambiente 3D (Three.js)
        const canvas = document.getElementById("canvas3d");
        const scene = new THREE.Scene();
        
        // Câmera Responsiva adaptada para distâncias comuns em dispositivos móveis
        const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

        // Iluminação de Estúdio
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x4f46e5, 0.3);
        dirLight2.position.set(-5, -5, 3);
        scene.add(dirLight2);

        // Grupo principal que conterá os elementos tridimensionais da molécula ativa
        const moleculeGroup = new THREE.Group();
        scene.add(moleculeGroup);

        // Materiais reutilizáveis otimizados para performance móvel
        const atomCentralMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2, metalness: 0.1 });
        const atomLiganteMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3 });
        const lonePairMat = new THREE.MeshStandardMaterial({ color: 0xa1a1aa, transparent: true, opacity: 0.5, wireframe: false });
        const bondMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

        // Geometrias Base reutilizáveis
        const coreGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const ligGeo = new THREE.SphereGeometry(0.4, 32, 32);
        const loneGeo = new THREE.SphereGeometry(0.35, 16, 16); // Balão/par livre

        // Função geradora de direções matemáticas (vetores) distribuídas uniformemente no espaço tridimensional
        function getVSEPRVectors(stericCount) {
            const vectors = [];
            if (stericCount === 2) {
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(0, -1, 0));
            } else if (stericCount === 3) {
                for (let i = 0; i < 3; i++) {
                    let angle = (i * 2 * Math.PI) / 3;
                    vectors.push(new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0));
                }
            } else if (stericCount === 4) {
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(Math.sqrt(8/9), -1/3, 0));
                vectors.push(new THREE.Vector3(-Math.sqrt(2/9), -1/3, Math.sqrt(2/3)));
                vectors.push(new THREE.Vector3(-Math.sqrt(2/9), -1/3, -Math.sqrt(2/3)));
            } else if (stericCount === 5) {
                // Axiais
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(0, -1, 0));
                // Equatoriais
                for (let i = 0; i < 3; i++) {
                    let angle = (i * 2 * Math.PI) / 3;
                    vectors.push(new THREE.Vector3(Math.cos(angle) * 0.9, 0, Math.sin(angle) * 0.9));
                }
            } else if (stericCount === 6) {
                vectors.push(new THREE.Vector3(0, 1, 0));
                vectors.push(new THREE.Vector3(0, -1, 0));
                vectors.push(new THREE.Vector3(1, 0, 0));
                vectors.push(new THREE.Vector3(-1, 0, 0));
                vectors.push(new THREE.Vector3(0, 0, 1));
                vectors.push(new THREE.Vector3(0, 0, -1));
            }
            return vectors;
        }

        // Reconstrói a visualização 3D dinamicamente com base no item selecionado no menu dropdown
        function updateSimulation(index) {
            const data = vseprData[index];

            // Atualização dos textos de acessibilidade e informação
            valGeometria.textContent = data.name;
            valAngulo.textContent = data.angle;
            valLigantes.textContent = data.lig;
            valLivres.textContent = data.lone;
            valArranjo.textContent = data.arr;
            valExemplo.textContent = data.ex;

            // Atualizar leitor de telas via anúncio dinâmico aria-live
            const screenReaderText = `Molécula alterada. Geometria ${data.name}, com ângulo de ${data.angle}. Possui ${data.lig} ligações e ${data.lone} pares livres.`;
            canvasContainer.setAttribute("aria-label", `Estrutura tridimensional de uma geometria ${data.name}. ` + screenReaderText);
            
            toastEl.textContent = `${data.name} (${data.angle})`;
            toastEl.style.opacity = 1;
            setTimeout(() => { toastEl.style.opacity = 0; }, 2000);

                        // Limpa o grupo 3D antigo de forma segura antes de desenhar o novo
            while(moleculeGroup.children.length > 0) { 
                moleculeGroup.remove(moleculeGroup.children); 
            }

            // Cria o Átomo Central (Roxo CPK)
            const centralAtom = new THREE.Mesh(coreGeo, new THREE.MeshStandardMaterial({ color: 0x9b5de5, roughness: 0.1, metalness: 0.2 }));
            moleculeGroup.add(centralAtom);

            // Resgata os vetores direcionais perfeitos baseados na Teoria VSEPR
            const directions = getVSEPRVectors(data.steric);
            
            let fX = 0, fY = 0, fZ = 0; // Contadores para o cálculo matemático da seta de polaridade
            let ligantesDesenhados = 0;

            // Loop inteligente que separa o que é átomo real e o que é balão de elétron livre
            directions.forEach((dir, i) => {
                const targetPos = dir.clone().multiplyScalar(2.2); // Define o tamanho dos braços de ligação

                if (ligantesDesenhados < data.lig) {
                    // IMPLEMENTAÇÃO: Define cores dinâmicas reais para cada tipo de elemento do exemplo
                    let corDoElemento = 0xffffff; // Branco para Hidrogênio padrão
                    if (data.ex.includes("CO₂") || data.ex.includes("SO₂") || data.ex.includes("H₂O") || data.ex.includes("O₂")) {
                        corDoElemento = 0xff4d4d; // Vermelho para Oxigênio
                    } else if (data.ex.includes("BF₃") || data.ex.includes("PCl₅") || data.ex.includes("SF₄") || data.ex.includes("ClF₃") || data.ex.includes("XeF₂") || data.ex.includes("SF₆") || data.ex.includes("BrF₅") || data.ex.includes("XeF₄") || data.ex.includes("HF")) {
                        corDoElemento = 0x00b4d8; // Azul/Verde para Halogênios (F, Cl)
                    }

                    // Desenha o Átomo Periférico
                    const atomMatCustom = new THREE.MeshStandardMaterial({ color: corDoElemento, roughness: 0.2 });
                    const ligMesh = new THREE.Mesh(ligGeo, atomMatCustom);
                    ligMesh.position.copy(targetPos);
                    moleculeGroup.add(ligMesh);

                    // Desenha o tubo da ligação química (Cilindro)
                    const bondMesh = criarCilindroBond(new THREE.Vector3(0,0,0), targetPos, 0.08, 0xaaaaaa);
                    moleculeGroup.add(bondMesh);

                    // Soma as forças eletrônicas no vetor dipolo
                    fX += dir.x; fY += dir.y; fZ += dir.z;
                    ligantesDesenhados++;
                } else {
                    // IMPLEMENTAÇÃO NEON: Pares livres em formato oval com material imune a sombras (luz própria)
                    const loneMesh = new THREE.Mesh(loneGeo, new THREE.MeshBasicMaterial({ color: 0xffb703, transparent: true, opacity: 0.65 }));
                    
                    // Alonga a esfera transformando-a em formato realista de balão/lobo eletrônico
                    loneMesh.scale.set(1, 1.6, 1);
                    loneMesh.position.copy(dir.clone().multiplyScalar(1.6));
                    loneMesh.lookAt(dir.clone().multiplyScalar(4));
                    loneMesh.rotateX(Math.PI / 2);
                    moleculeGroup.add(loneMesh);

                    // Repulsão dos pares livres afeta a polaridade
                    fX -= dir.x * 0.4; fY -= dir.y * 0.4; fZ -= dir.z * 0.4;
                }
            });

            // IMPLEMENTAÇÃO DIPOLO: Renderiza a seta vermelha tridimensional se a geometria for Polar
            const totalMagnitude = Math.sqrt(fX*fX + fY*fY + fZ*fZ);
            // Lista rigorosa de geometrias polares da Teoria VSEPR
            const geometriasPolares = ["Angular", "Piramidal Trigonal", "Gangorra", "Forma de T", "Pirâmide Quadrada", "Linear (Com 1 Par)", "Linear (Com 3 Pares)", "Linear (Com 4 Pares)", "Forma de T (Teórica)"];
            
            if (totalMagnitude > 0.1 && geometriasPolares.includes(data.name)) {
                const vectorDirection = new THREE.Vector3(-fX, -fY, -fZ).normalize();
                const dipoleArrow = new THREE.ArrowHelper(vectorDirection, new THREE.Vector3(0,0,0), 2.2, 0xff3333, 0.4, 0.18);
                moleculeGroup.add(dipoleArrow);
            }
        }

                // Função auxiliar que calcula a rotação e escala perfeita para desenhar os tubos de ligações
        function criarCilindroBond(pA, pB, r, cor) {
            const distance = new THREE.Vector3().subVectors(pB, pA);
            const cylinderLength = distance.length();
            const geometry = new THREE.CylinderGeometry(r, r, cylinderLength, 16);
            const material = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.4 });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.copy(pA).add(distance.multiplyScalar(0.5));
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), distance.clone().normalize());
            return mesh;
        }

        // IMPLEMENTAÇÃO: Criação dinâmica da Legenda Visual solicitada dentro da barra lateral
        function injetarLegendaVisual() {
            const painelInfo = document.getElementById("info-panel");
            if (!painelInfo) return;
            
            const legendaHTML = `
                <div style="margin-top:1.2rem; padding-top:0.6rem; border-top:1px dashed var(--border); display:flex; flex-wrap:wrap; gap:0.6rem;">
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#9b5de5; border-radius:3px; margin-right:5px; display:inline-block;"></span> Central</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ffffff; border-radius:3px; margin-right:5px; display:inline-block;"></span> Hidrogênio (H)</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#00b4d8; border-radius:3px; margin-right:5px; display:inline-block;"></span> Halogênio (Cl/F)</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ff4d4d; border-radius:3px; margin-right:5px; display:inline-block;"></span> Oxigênio (O)</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ffb703; border-radius:3px; margin-right:5px; display:inline-block;"></span> Par Neon</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ff3333; border-radius:3px; margin-right:5px; display:inline-block;"></span> Seta Dipolo (&mu;)</div>
                </div>`;
            painelInfo.insertAdjacentHTML('beforeend', legendaHTML);
        }

                // Configuração dos controles de arrastar com o dedo (Tablet) ou Mouse (PC)
        function setupInteraction() {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            const onStart = (x, y) => { isDragging = true; previousMousePosition = { x, y }; };
            const onMove = (x, y) => {
                if (!isDragging) return;
                const deltaX = x - previousMousePosition.x;
                const deltaY = y - previousMousePosition.y;

                moleculeGroup.rotation.y += deltaX * 0.01;
                moleculeGroup.rotation.x += deltaY * 0.01;
                previousMousePosition = { x, y };
            };

            canvasContainer.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', () => isDragging = false);

            canvasContainer.addEventListener('touchstart', (e) => {
                if(e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (e) => {
                if(e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchend', () => isDragging = false);

            // Garante que o motor 3D recalcule o tamanho caso o tablet mude de posição (de pé ou deitado)
            window.addEventListener('resize', () => {
                camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight, false);
            });
        }

        // Loop contínuo de animação que gera o efeito de rotação suave automática
        function animate() {
            requestAnimationFrame(animate);
            if (!isDragging) {
                moleculeGroup.rotation.y += 0.003;
            }
            renderer.render(scene, camera);
        }

        // Variável de controle compartilhada com a interação
        let isDragging = false;

        // Dispara o simulador quando a página carrega por completo
        window.onload = () => {
            injetarLegendaVisual();
            init();
            selectEl.addEventListener('change', (e) => updateSimulation(e.target.value));
        };
    </script>
</body>
</html>

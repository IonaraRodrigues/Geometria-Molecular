<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador 3D Prático de Geometria Molecular (VSEPR)</title>
    <style>
        :root {
            --bg-primary: #121214;
            --bg-surface: #1a1a1e;
            --bg-control: #26262b;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent: #4f46e5;
            --border: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-surface);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }

        .main-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            height: calc(100vh - 70px);
        }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; height: auto; }
            .canvas-container { height: 50vh !important; }
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #22252a 0%, #0f1012 100%);
            height: 100%;
        }

        #canvas3d { width: 100%; height: 100%; display: block; }

        .sidebar {
            width: 360px;
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        @media (max-width: 900px) {
            .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); }
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group {
            background-color: var(--bg-control);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }

        select {
            width: 100%; padding: 0.75rem; background-color: var(--bg-surface); color: var(--text-main);
            border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; cursor: pointer; outline: none;
        }
        select:focus { border-color: var(--accent); }

        .info-panel { background-color: rgba(79, 70, 229, 0.1); border: 1px solid var(--accent); border-radius: 8px; padding: 1rem; }
        .info-row { margin-bottom: 0.5rem; font-size: 0.95rem; }
        .info-row strong { color: var(--text-muted); font-weight: 500; }
        .info-val { color: #f3f4f6; font-weight: bold; display: inline-block; margin-left: 0.25rem; }

        .accessibility-toast {
            position: absolute; bottom: 1rem; left: 1rem; background: rgba(0,0,0,0.8); color: #fff;
            padding: 0.5rem 1rem; border-radius: 4px; font-size: 0.85rem; pointer-events: none; opacity: 0; z-index: 10;
        }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>
    <header>
        <h1>Simulador 3D Prático de Geometria Molecular (VSEPR)</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Acessível e adaptável para qualquer tela</p>
    </header>

    <main class="main-container">
        <div class="canvas-container" role="img" id="canvas-container" aria-label="Visualização 3D da molécula.">
            <canvas id="canvas3d"></canvas>
            <div id="toast" class="accessibility-toast" aria-live="polite"></div>
        </div>

        <section class="sidebar" aria-label="Painel de Controle e Informações">
            <div class="control-group">
                <h2 class="section-title">1. Escolha a Configuração (20 Opções)</h2>
                <label id="molecule-select-label" for="molecule-select">Selecione o arranjo de pares eletrônicos:</label>
                <select id="molecule-select" aria-labelledby="molecule-select-label">
                </select>
            </div>

            <div class="info-panel" id="info-panel" aria-live="assertive">
                <h2 class="section-title">2. Dados Detalhados</h2>
                <div class="info-row"><strong>Geometria:</strong><span class="info-val" id="val-geometria">-</span></div>
                <div class="info-row"><strong>Ângulo Ideal:</strong><span class="info-val" id="val-angulo">-</span></div>
                <div class="info-row"><strong>Pares Ligantes:</strong><span class="info-val" id="val-ligantes">-</span></div>
                <div class="info-row"><strong>Pares Livres:</strong><span class="info-val" id="val-livres">-</span></div>
                <div class="info-row"><strong>Arranjo das Nuvens:</strong><span class="info-val" id="val-arranjo">-</span></div>
                <div class="info-row" style="margin-top: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.5rem;">
                    <strong>Exemplo Real:</strong><span class="info-val" id="val-exemplo">-</span>
                </div>
            </div>
        </section>
    </main>

        <script>
        // Banco de dados oficial VSEPR com coordenadas espaciais unificadas
        const vseprData = [
            { steric: 2, lig: 2, lone: 0, name: "Linear", angle: "180°", arr: "Linear", polarity: "Apolar", ex: "CO₂ (Dióxido de Carbono)", coords: [[0,0,1.2], [0,0,-1.2]], loneCoords: [], atomColors: [0xff4d4d, 0xff4d4d] },
            { steric: 3, lig: 3, lone: 0, name: "Trigonal Plana", angle: "120°", arr: "Trigonal Plana", polarity: "Apolar", ex: "BF₃ (Trifluoreto de Boro)", coords: [[0,1.2,0], [-1.04,-0.6,0], [1.04,-0.6,0]], loneCoords: [], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 3, lig: 2, lone: 1, name: "Angular", angle: "< 120°", arr: "Trigonal Plana", polarity: "Polar", ex: "SO₂ (Dióxido de Enxofre)", coords: [[-1.04,-0.6,0], [1.04,-0.6,0]], loneCoords: [[0,1.2,0]], atomColors: [0xff4d4d, 0xff4d4d] },
            { steric: 4, lig: 4, lone: 0, name: "Tetraédrica", angle: "109.5°", arr: "Tetraédrica", polarity: "Apolar", ex: "CH₄ (Metano)", coords: [[0,1.2,0], [1.13,-0.4,0], [-0.56,-0.4,0.98], [-0.56,-0.4,-0.98]], loneCoords: [], atomColors: [0xffffff, 0xffffff, 0xffffff, 0xffffff] },
            { steric: 4, lig: 3, lone: 1, name: "Piramidal Trigonal", angle: "107°", arr: "Tetraédrica", polarity: "Polar", ex: "NH₃ (Amônia)", coords: [[1.13,-0.4,0], [-0.56,-0.4,0.98], [-0.56,-0.4,-0.98]], loneCoords: [[0,1.2,0]], atomColors: [0xffffff, 0xffffff, 0xffffff] },
            { steric: 4, lig: 2, lone: 2, name: "Angular", angle: "104.5°", arr: "Tetraédrica", polarity: "Polar", ex: "H₂O (Água)", coords: [[-0.56,-0.4,0.98], [-0.56,-0.4,-0.98]], loneCoords: [[0,1.2,0], [1.13,-0.4,0]], atomColors: [0xffffff, 0xffffff] },
            { steric: 5, lig: 5, lone: 0, name: "Bipirâmide Trigonal", angle: "90° e 120°", arr: "Bipirâmide Trigonal", polarity: "Apolar", ex: "PCl₅ (Pentacloreto de Fósforo)", coords: [[0,1.2,0], [0,-1.2,0], [1.2,0,0], [-0.6,0,1.04], [-0.6,0,-1.04]], loneCoords: [], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 5, lig: 4, lone: 1, name: "Gangorra", angle: "90° e < 120°", arr: "Bipirâmide Trigonal", polarity: "Polar", ex: "SF₄ (Tetrafluoreto de Enxofre)", coords: [[0,1.2,0], [0,-1.2,0], [-0.6,0,1.04], [-0.6,0,-1.04]], loneCoords: [[1.2,0,0]], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 5, lig: 3, lone: 2, name: "Forma de T", angle: "~ 90°", arr: "Bipirâmide Trigonal", polarity: "Polar", ex: "ClF₃ (Trifluoreto de Cloro)", coords: [[0,1.2,0], [0,-1.2,0], [-0.6,0,1.04]], loneCoords: [[1.2,0,0], [-0.6,0,-1.04]], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 5, lig: 2, lone: 3, name: "Linear", angle: "180°", arr: "Bipirâmide Trigonal", polarity: "Apolar", ex: "XeF₂ (Difluoreto de Xenônio)", coords: [[0,1.2,0], [0,-1.2,0]], loneCoords: [[1.2,0,0], [-0.6,0,1.04], [-0.6,0,-1.04]], atomColors: [0x00b4d8, 0x00b4d8] },
            { steric: 6, lig: 6, lone: 0, name: "Octaédrica", angle: "90°", arr: "Octaédrica", polarity: "Apolar", ex: "SF₆ (Hexafluoreto de Enxofre)", coords: [[0,1.2,0], [0,-1.2,0], [1.2,0,0], [-1.2,0,0], [0,0,1.2], [0,0,-1.2]], loneCoords: [], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 6, lig: 5, lone: 1, name: "Piramidal Quadrada", angle: "~ 90°", arr: "Octaédrica", polarity: "Polar", ex: "BrF₅ (Pentafluoreto de Bromo)", coords: [[0,1.2,0], [1.2,0,0], [-1.2,0,0], [0,0,1.2], [0,0,-1.2]], loneCoords: [[0,-1.2,0]], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 6, lig: 4, lone: 2, name: "Quadrada Plana", angle: "90°", arr: "Octaédrica", polarity: "Apolar", ex: "XeF₄ (Tetrafluoreto de Xenônio)", coords: [[1.2,0,0], [-1.2,0,0], [0,0,1.2], [0,0,-1.2]], loneCoords: [[0,1.2,0], [0,-1.2,0]], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 6, lig: 3, lone: 3, name: "Forma de T (Teórica)", angle: "~ 90°", arr: "Octaédrica", polarity: "Polar", ex: "Interhalogênios Complexos", coords: [[1.2,0,0], [-1.2,0,0], [0,0,1.2]], loneCoords: [[0,1.2,0], [0,-1.2,0], [0,0,-1.2]], atomColors: [0x00b4d8, 0x00b4d8, 0x00b4d8] },
            { steric: 6, lig: 2, lone: 4, name: "Linear (Teórica)", angle: "180°", arr: "Octaédrica", polarity: "Apolar", ex: "Arranjos Teóricos Nobres", coords: [[0,0,1.2], [0,0,-1.2]], loneCoords: [[0,1.2,0], [0,-1.2,0], [1.2,0,0], [-1.2,0,0]], atomColors: [0x00b4d8, 0x00b4d8] },
            { steric: 1, lig: 1, lone: 0, name: "Linear (Diatômica)", angle: "Não aplicável", arr: "Linear", polarity: "Polar", ex: "HCl (Cloreto de Hidrogênio)", coords: [[0,0,1.2]], loneCoords: [], atomColors: [0xffffff] },
            { steric: 2, lig: 1, lone: 1, name: "Linear (Com 1 Par)", angle: "Não aplicável", arr: "Linear", polarity: "Polar", ex: "CO (Monóxido de Carbono)", coords: [[0,0,1.2]], loneCoords: [[0,0,-1.2]], atomColors: [0xff4d4d] },
            { steric: 3, lig: 1, lone: 2, name: "Linear (Com 2 Pares)", angle: "Não aplicável", arr: "Linear", polarity: "Apolar", ex: "O₂ (Gás Oxigênio)", coords: [[0,0,1.2]], loneCoords: [[0,1.2,0], [0,-1.2,0]], atomColors: [0xff4d4d] },
            { steric: 4, lig: 1, lone: 3, name: "Linear (Com 3 Pares)", angle: "Não aplicável", arr: "Linear", polarity: "Polar", ex: "HF (Fluoreto de Hidrogênio)", coords: [[0,0,1.2]], loneCoords: [[1.2,0,0], [-0.6,1.04,0], [-0.6,-1.04,0]], atomColors: [0xffffff] },
            { steric: 5, lig: 1, lone: 4, name: "Linear (Com 4 Pares)", angle: "Não aplicável", arr: "Tetraédrica", polarity: "Polar", ex: "Modelos Avançados Computacionais", coords: [[0,0,1.2]], loneCoords: [[0,1.2,0], [1.13,-0.4,0], [-0.56,-0.4,0.98], [-0.56,-0.4,-0.98]], atomColors: [0x00b4d8] }
        ];

        let scene, camera, renderer, moleculeGroup;
        const select = document.getElementById('molecule-select');
        const container3d = document.getElementById('canvas-container');
        const toast = document.getElementById('toast');

        function init() {
            select.innerHTML = "";
            vseprData.forEach((mol, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `Nuvens: ${mol.steric} → Ligantes: ${mol.lig} | Livres: ${mol.lone} (${mol.name})`;
                select.appendChild(opt);
            });

            // Geração automática da legenda visual solicitada
            const legendaHTML = `
                <div style="margin-top:1.2rem; padding-top:0.6rem; border-top:1px dashed var(--border); display:flex; flex-wrap:wrap; gap:0.6rem;">
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#9b5de5; border-radius:3px; margin-right:5px; display:inline-block;"></span> Central</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ffffff; border-radius:3px; margin-right:5px; display:inline-block;"></span> Hidrogênio</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#00b4d8; border-radius:3px; margin-right:5px; display:inline-block;"></span> Halogênio</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ff4d4d; border-radius:3px; margin-right:5px; display:inline-block;"></span> Oxigênio</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ffb703; border-radius:3px; margin-right:5px; display:inline-block;"></span> Par Neon</div>
                    <div style="display:flex; align-items:center; font-size:0.8rem; color:var(--text-muted);"><span style="width:12px; height:12px; background:#ff3333; border-radius:3px; margin-right:5px; display:inline-block;"></span> Vetor Dipolo</div>
                </div>`;
            document.getElementById('info-panel').insertAdjacentHTML('beforeend', legendaHTML);

            setupThreeJS();
            updateModel(0);
            
            select.addEventListener('change', (e) => updateModel(e.target.value));
            setupInteraction();
            animate();
        }

        function setupThreeJS() {
            scene = new THREE.Scene();
            
            // Foco em 9 afasta um pouco a visão e deixa a molécula menor e proporcional
            camera = new THREE.PerspectiveCamera(45, container3d.clientWidth / container3d.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 9);

            const canvasElement = document.createElement('canvas');
            canvasElement.id = "canvas3d";
            canvasElement.style.width = "100%"; canvasElement.style.height = "100%";
            canvasElement.style.minHeight = "450px"; canvasElement.style.display = "block";
            document.getElementById('canvas3d').replaceWith(canvasElement);

            renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container3d.clientWidth, container3d.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const light1 = new THREE.DirectionalLight(0xffffff, 0.8); light1.position.set(5, 5, 5); scene.add(light1);
            const light2 = new THREE.DirectionalLight(0x4ea8de, 0.2); light2.position.set(-5, -5, 5); scene.add(light2);

            moleculeGroup = new THREE.Group();
            scene.add(moleculeGroup);
        }

        function updateModel(index) {
            const data = vseprData[index];
            if (!data) return;
            document.getElementById('val-geometria').textContent = data.name;
            document.getElementById('val-angulo').textContent = data.angle;
            document.getElementById('val-ligantes').textContent = data.lig;
            document.getElementById('val-livres').textContent = data.lone;
            document.getElementById('val-arranjo').textContent = data.arr;
            document.getElementById('val-exemplo').textContent = data.ex;toast.textContent = Carregado: ${data.name}.;
            toast.style.opacity = 1; setTimeout(() => toast.style.opacity = 0, 1500);
            while(moleculeGroup.children.length > 0) moleculeGroup.remove(moleculeGroup.children);
            // Átomo Central (Esfera Roxa)
            const centralGeo = new THREE.SphereGeometry(0.45, 32, 32);
            const centralMat = new THREE.MeshStandardMaterial({ color: 0x9b5de5, roughness: 0.1, metalness: 0.2 });
            moleculeGroup.add(new THREE.Mesh(centralGeo, centralMat));
            let fX = 0, fY = 0, fZ = 0;
            // Átomos Conectados com Cores Customizadas Diferentesdata.coords.forEach((pos, idx) => {const vec = new THREE.Vector3(pos[0], pos[1], pos[2]);
            fX += vec.x; 
            fY += vec.y; 
            fZ += vec.z;
            const atomGeo = new THREE.SphereGeometry(0.32, 32, 32);
            const atomMat = new THREE.MeshStandardMaterial({ color: data.atomColors[idx] || 0xffffff, roughness: 0.2 });
            const atomMesh = new THREE.Mesh(atomGeo, atomMat);
            atomMesh.position.copy(vec);
            moleculeGroup.add(atomMesh);
            moleculeGroup.add(criarCilindro(new THREE.Vector3(0,0,0), vec, 0.07, 0xaaaaaa));});
            // IMPLEMENTAÇÃO NEON: Balões imunes a sombras com cor estável e luz própria
            data.loneCoords.forEach(pos => {const vec = new THREE.Vector3(pos[0], pos[1], pos[2]);
                                            fX -= vec.x * 0.4; 
                                            fY -= vec.y * 0.4; 
                                            fZ -= vec.z * 0.4;
                                            const loneGeo = new THREE.SphereGeometry(0.25, 32, 32); 
                                            loneGeo.scale(1, 1.5, 1);
                                            const loneMat = new THREE.MeshBasicMaterial({ color: 0xffb703, transparent: true, opacity: 0.65 });
                                            const loneMesh = new THREE.Mesh(loneGeo, loneMat);
                                            loneMesh.position.copy(vec);
                                            loneMesh.lookAt(vec.clone().multiplyScalar(2)); 
                                            loneMesh.rotateX(Math.PI / 2);
                                            moleculeGroup.add(loneMesh);});
            // IMPLEMENTAÇÃO MOMENTO DE DIPOLO: Renderiza seta vermelha 3D em geometrias Polares
            const mag = Math.sqrt(fXfX + fYfY + fZ*fZ);
            const polares = ["Angular", "Piramidal Trigonal", "Gangorra", "Forma de T", "Piramidal Quadrada", "Linear (Diatômica)", "Linear (Com 1 Par)", "Linear (Com 3 Pares)", "Linear (Com 4 Pares)", "Forma de T (Teórica)"];
            if (mag > 0.1 && polares.includes(data.name)) {const direcao = new THREE.Vector3(-fX, -fY, -fZ).normalize();
                                                           moleculeGroup.add(new THREE.ArrowHelper(direcao, new THREE.Vector3(0,0,0), 1.8, 0xff3333, 0.35, 0.15));}}
            function criarCilindro(pA, pB, r, cor) {
                const direction = new THREE.Vector3().subVectors(pB, pA), len = direction.length();
                const geo = new THREE.CylinderGeometry(r, r, len, 16), mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.4 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pA).add(direction.multiplyScalar(0.5));
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
                return mesh;
            }
            function setupInteraction() {
                let isDragging = false, prevMouse = { x: 0, y: 0 };
                const startMove = (x, y) => { isDragging = true; prevMouse = { x, y }; };
                const move = (x, y) => {if (!isDragging) return;
                                        moleculeGroup.rotation.y += (x - prevMouse.x) * 0.01;
                                        moleculeGroup.rotation.x += (y - prevMouse.y) * 0.01;
                                        prevMouse = { x, y };
                                       };
                container3d.addEventListener('mousedown', (e) => startMove(e.clientX, e.clientY));
                window.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
                window.addEventListener('mouseup', () => isDragging = false);
                container3d.addEventListener('touchstart', (e) => {if(e.touches.length === 1) startMove(e.touches.clientX, e.touches.clientY);}, { passive: true });
                window.addEventListener('touchmove', (e) => {if(e.touches.length === 1) move(e.touches.clientX, e.touches.clientY);}, { passive: true });
                window.addEventListener('touchend', () => isDragging = false);
                window.addEventListener('resize', () => {camera.aspect = container3d.clientWidth / container3d.clientHeight; 
                                                         camera.updateProjectionMatrix();
                                                         renderer.setSize(container3d.clientWidth, container3d.clientHeight);
                                                        });
            }
            function animate() {
                requestAnimationFrame(animate);
                moleculeGroup.rotation.y += 0.003;
                renderer.render(scene, camera);
            }
            window.onload = init;
